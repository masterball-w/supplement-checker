<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;width:1280px;height:640px;font-family:"Noto Sans CJK SC",sans-serif;background:#F4F7F2;overflow:hidden}
.wrap{position:relative;width:1280px;height:640px;box-sizing:border-box;padding:80px 80px}.left{width:700px}
.tag{display:inline-block;font-size:20px;color:#2E7D5B;border:2px solid #2E7D5B;border-radius:999px;padding:4px 16px;letter-spacing:1px}
h1{font-size:62px;margin:26px 0 8px;color:#12261C;font-weight:900;letter-spacing:-1px}
.zh{font-size:32px;color:#12261C;font-weight:700;margin:0 0 30px}
.sub{font-size:24px;color:#4B5B52;line-height:1.6;max-width:620px}
.cards{position:absolute;right:70px;top:100px;width:380px;display:flex;flex-direction:column;gap:22px}
.card{background:#fff;border-radius:16px;padding:20px 24px;box-shadow:0 6px 24px rgba(18,38,28,.08);border-left:6px solid #2E7D5B}
.card b{display:block;font-size:24px;color:#12261C}.card span{font-size:17px;color:#5B6B62}
.card.b{border-color:#C28A2C}.card.c{border-color:#3A6EA5}
.foot{position:absolute;left:80px;bottom:48px;font-size:18px;color:#7A877F}
</style></head><body><div class="wrap">
<div class="left"><span class="tag">Agent Skill · 保健品核查</span>
<h1>supplement-checker</h1>
<div class="zh">拍一张保健品，查证据、查资质、比价格</div>
<div class="sub">从图片识别成分与剂量，引用可核验的研究、官方数据库和实时价格，生成带来源的核查报告。</div></div>
<div class="cards">
<div class="card"><b>① 功效证据</b><span>RCT · Meta 分析 · 动物研究 · 剂量对比</span></div>
<div class="card b"><b>② 合规资质</b><span>FDA/DSLD · TGA · NPN · 消費者庁 · 蓝帽子 · USP/NSF</span></div>
<div class="card c"><b>③ 价格对比</b><span>多渠道同款 · 按有效日剂量折算 · 记录核查时间</span></div>
</div>
<div class="foot">研究辅助工具，不构成医疗或法律建议 · MIT License</div>
</div></body></html>
